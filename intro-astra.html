        vec2 cells=vUv*vec2(58,43)+vec2(time*.035,0.0),cell=floor(cells),f=fract(cells)-.5;
        float seed=h(cell),star=exp(-dot(f,f)/(0.001+seed*.0015))*step(.95,seed);

        col+=(h(gl_FragCoord.xy)-.5)*.0006;
        gl_FragColor=vec4(col,alpha);

  }));cardSky.layers.set(1);cardSky.renderOrder=4;cardSky.position.set(5.1,-.4,.45);g.add(cardSky);
  const cc=card.ctx,W=1320,H=990;cc.scale(180/110,180/110);

    const outFade = 1 - seg(t, 4.0, 4.55, easeInOutCubic);
    ov.mat.opacity = outFade;

/* The source film's render pipeline, with transport, reduced motion and bounded
   pointer parallax added for this authored companion. */
let SCENES=[], T=0, cur=-1, playing=true, tPrev=performance.now()/1000;
const motionQuery=matchMedia('(prefers-reduced-motion: reduce)');
const fullCapture=document.documentElement.dataset.capture==='full';
const capture=fullCapture||document.documentElement.dataset.capture==='frames';
// A deterministic ten-second edit for native browser-frame recording only.
let captureFrame=0;
const previewCuts=[[0,.5],[75,4.5],[135,8.4],[180,13.2],[225,18.4],[270,22.3]];
function previewTime(frame){if(fullCapture)return frame/30;const [at,time]=previewCuts.findLast(([at])=>frame>=at);return time+(frame-at)/30;}

const pointer={x:0,y:0};
const chapterTitleEl = document.getElementById('chapterTitle');
const navDots = document.querySelectorAll('.nav-dot');

function renderAt(t){
  let idx=SCENES.findIndex(s=>t>=s.start&&t<s.end);if(idx<0)idx=SCENES.length-1;
  const s=SCENES[idx];if(idx!==cur){SCENES.forEach((x,i)=>x.group.visible=i===idx);cur=idx;}
  const lt=t-s.start;rig.focusDist=null;s.update(lt);applyGlobalCamera(t);updateAtmosphere(t,idx);
  const transition=sceneTransition(t);
  rig.dist+=transition.weight*0.22;
  grade.uniforms.astraBridge.value=transition.weight*0.82;grade.uniforms.astraCenter.value.set(...transition.center);
  surfaceReveals.forEach(({u,delay})=>u.value=seg(lt,delay,delay+.7,easeOutCubic));
  if(!motionQuery.matches){rig.yaw+=pointer.x*.7;rig.pitch+=pointer.y*.4;}
  applyRig();const fin=seg(lt,0,.20,easeOutCubic);
  dof.uniforms.focus.value=camera.position.distanceTo(rig.focusPoint)-(1-fin)*0.6;
  dof.uniforms.aperture.value=rig.aperture+.010*(1-fin);dof.uniforms.maxblur.value=rig.maxblur*(1+0.35*(1-fin));
  grade.uniforms.time.value=t;grade.uniforms.fade.value=1;
  camera.layers.set(0);scene.overrideMaterial=depthMat;renderer.setClearColor(0xffffff,1);renderer.setRenderTarget(depthRT);renderer.clear();renderer.render(scene,camera);
  scene.overrideMaterial=null;camera.layers.enableAll();renderer.autoClear=false;
  for(const d of DEPTH_WRITERS){let o=d.mesh,vis=true;while(o){if(!o.visible){vis=false;break;}o=o.parent;}if(!vis)continue;const m=d.mesh.material;d.mesh.material=d.mat;renderer.render(d.mesh,camera);d.mesh.material=m;}
  renderer.autoClear=true;renderer.setRenderTarget(null);renderer.setClearColor(0x000000,1);composer.render();
  
  if(chapterTitleEl) chapterTitleEl.textContent=`0${idx+1} // ${CHAPTERS[idx]}`;
  navDots.forEach((btn, i) => {
    if(i === idx) {
      btn.style.background = '#F00613';
      btn.style.width = '10px';
      btn.style.height = '10px';
      btn.style.boxShadow = '0 0 10px rgba(240,6,19,0.8)';
    } else {
      btn.style.background = 'rgba(255,255,255,0.25)';
      btn.style.width = '8px';
      btn.style.height = '8px';
      btn.style.boxShadow = 'none';
    }
  });

  document.body.dataset.time=t.toFixed(4);document.body.dataset.chapter=String(idx);document.body.dataset.shot=String(cameraBeatIndex);
}

let hasEntered = false;
function enterSite() {
  if (hasEntered) return;
  hasEntered = true;
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ action: 'dismiss_intro' }, '*');
  } else {
    window.location.href = 'index.html#hero';
  }
}
document.getElementById('enterSiteBtn')?.addEventListener('click', enterSite);
document.getElementById('gl')?.addEventListener('click', (e) => {
  if (T >= TOTAL - 3.5) enterSite();
});

let targetT = 0;
let userScrolled = false;
let scrollTimeout = null;

// Interactive Wheel / Scroll (Silky Proportional Cinematic Scroll)
window.addEventListener('wheel', (e) => {
  userScrolled = true;
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => { userScrolled = false; }, 1800);

  const rawDelta = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaMode === 2 ? e.deltaY * 300 : e.deltaY;
  // Natural dynamic scrub: gentle flick = smooth progress, fast spin = swift scene change
  const step = Math.sign(rawDelta) * Math.min(1.6, Math.max(0.4, Math.abs(rawDelta) * 0.005));
  targetT = Math.max(0, Math.min(TOTAL - 0.001, targetT + step));
  if (targetT >= TOTAL - 0.4) {
    setTimeout(enterSite, 400);
  }
}, { passive: true });

// Mobile Touch Swipe
let touchStartY = 0;
window.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  const currentY = e.touches[0].clientY;
  const dy = touchStartY - currentY;
  touchStartY = currentY;
  userScrolled = true;
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => { userScrolled = false; }, 1800);
  targetT = Math.max(0, Math.min(TOTAL - 0.001, targetT + dy * 0.018));
  if (targetT >= TOTAL - 0.4) {
    setTimeout(enterSite, 400);
  }
}, { passive: true });

// Chapter dots click
navDots.forEach(btn => {
  btn.addEventListener('click', () => {
    userScrolled = true;
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => { userScrolled = false; }, 1800);
    targetT = Number(btn.dataset.time) + 0.1;
  });
});

addEventListener('pointermove',e=>{pointer.x=e.clientX/innerWidth*2-1;pointer.y=e.clientY/innerHeight*2-1;});
addEventListener('keydown',e=>{
  if(e.code==='ArrowRight'||e.code==='ArrowDown'||e.code==='Space'||e.code==='PageDown'){
    e.preventDefault();
    userScrolled = true;
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => { userScrolled = false; }, 1800);
    targetT = Math.min(TOTAL - 0.001, targetT + 1.2);
    if(targetT >= TOTAL - 0.4) enterSite();
  } else if(e.code==='ArrowLeft'||e.code==='ArrowUp'||e.code==='PageUp'){
    e.preventDefault();
    userScrolled = true;
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => { userScrolled = false; }, 1800);
    targetT = Math.max(0, targetT - 1.2);
  } else if(e.code==='Enter'){
    enterSite();
  }
});

// Dynamic cinematic speed curve: variable rhythm with suspense & momentum
function getCinematicSpeed(t) {
  const boundaries = [0, 3.2, 7.6, 11.8, 16.4, 20.6, 23.8];
  let distToBoundary = 999;
  for (const b of boundaries) {
    const d = Math.abs(t - b);
    if (d < distToBoundary) distToBoundary = d;
  }

  // During shot transitions (within 0.45s of a boundary):
  // dynamic camera push / acceleration creates cinematic trailer suspense and momentum!
  if (distToBoundary < 0.45) {
    const p = distToBoundary / 0.45;
    return 1.35 - 0.30 * p;
  }

  // Confident, steady cinematic pace during scene presentation
  return 1.05;
}

function loop(){
  requestAnimationFrame(loop);
  const now = performance.now()/1000;
  const dt = Math.min(0.05, now - tPrev);
  tPrev = now;
  if(document.hidden) return;

  if (userScrolled) {
    // Silky frame-rate independent spring damping (responsive, zero sluggish lag)
    const factor = 1 - Math.exp(-9.5 * dt);
    T += (targetT - T) * factor;
  } else {
    // Dynamic cinematic trailer pacing with suspense & momentum
    const speed = getCinematicSpeed(T);
    T += dt * speed;
    if (T >= TOTAL - 0.35) {
      T = TOTAL - 0.35;
      enterSite();
      return;
    }
    targetT = T;
  }
  renderAt(T);
}
(async()=>{try{
  try {
    await Promise.allSettled([
      document.fonts.load('400 40px Geist'),

  grade.uniforms.grain.value=.015;grade.uniforms.vig.value=.35;grade.uniforms.ca.value=.0010;bloom.strength=.58;bloom.radius=.70;
  T = 0;
  targetT = 0;
  renderAt(T);
  document.body.dataset.ready='true';
  const loadEl = document.getElementById('loading');
  if (loadEl) loadEl.hidden = true;
  loop();
}catch(err){
  console.error('Codex Astra init failed',err);
  const loadEl = document.getElementById('loading');
  if (loadEl) loadEl.hidden = true;
}})();
